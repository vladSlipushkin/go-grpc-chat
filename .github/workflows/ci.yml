name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - uses: golangci/golangci-lint-action@v9
        with:
          version: v2.14.0

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Test with race detector
        # Generated packages have no tests and would drag the total to near zero.
        run: go test -race -coverprofile=coverage.out $(go list ./... | grep -v /gen/)
      - name: Coverage summary
        run: go tool cover -func=coverage.out | tail -n 1

  proto:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # buf breaking reads main from local history
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache-dependency-path: tools/go.sum
      - name: Lint
        run: go tool -modfile=tools/go.mod buf lint
      - name: Format
        run: go tool -modfile=tools/go.mod buf format --diff --exit-code
      - name: Breaking changes against main
        if: github.event_name == 'pull_request'
        run: |
          if ! git rev-parse --verify --quiet origin/main >/dev/null; then
            echo "::error::origin/main is not fetched, cannot check breaking changes"
            exit 1
          fi
          if ! git cat-file -e origin/main:buf.yaml 2>/dev/null; then
            echo "::notice::main has no protobuf module yet, skipping breaking change check"
            exit 0
          fi
          git branch --force main origin/main
          go tool -modfile=tools/go.mod buf breaking --against ".git#branch=main"
      - name: Generated code is up to date
        run: |
          go tool -modfile=tools/go.mod buf generate
          if [ -n "$(git status --porcelain -- gen)" ]; then
            echo "::error::gen/ is out of date, run 'make gen' and commit the result"
            git status --porcelain -- gen
            exit 1
          fi

  vuln:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache-dependency-path: tools/go.sum
      - run: go tool -modfile=tools/go.mod govulncheck ./...

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Check modules are tidy
        run: |
          go mod tidy -diff
          go -C tools mod tidy -diff
      - run: go build ./...
