version: "2"

linters:
  default: standard
  enable:
    - bodyclose
    - contextcheck
    - copyloopvar
    - errname
    - errorlint
    - gocritic
    - gosec
    - intrange
    - misspell
    - nilerr
    - noctx
    - protogetter
    - revive
    - sloglint
    - thelper
    - unconvert
    - unparam
    - usestdlibvars
  settings:
    sloglint:
      no-mixed-args: true
      static-msg: true
  exclusions:
    generated: lax
    presets:
      - common-false-positives
      - std-error-handling
    rules:
      - path: _test\.go
        linters:
          - gosec

formatters:
  enable:
    - gofmt
    - goimports
  settings:
    goimports:
      local-prefixes:
        - github.com/vladSlipushkin/go-grpc-chat
