# The server with TLS, on top of compose.yaml:
#   make certs
#   docker compose -f compose.yaml -f compose.tls.yaml up --detach --wait server
services:
  server:
    environment:
      CHAT_TLS_CERT_FILE: /certs/server.pem
      CHAT_TLS_KEY_FILE: /certs/server.key
    volumes:
      - ./certs:/certs:ro
